[package]
name = "robot-tui"
version = "0.1.0"
description = "tui to interface with the robot directly instead of via the ui"
authors = ["hiracat <hiracat@proton.me>"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
color-eyre = "0.6.5"
serialport = { version = "4.10.1", default-features = false }
serde = "1.0.229"
protocol = { path = "../protocol/" }
serde_json = "1.0.154"
log = "0.4.34"
heapless = "0.9.3"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
